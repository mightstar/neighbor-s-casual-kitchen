services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neighbors
      POSTGRES_PASSWORD: neighbors
      POSTGRES_DB: neighbors
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighbors -d neighbors"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://neighbors:neighbors@db:5432/neighbors
      JWT_SECRET: local-docker-jwt-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
