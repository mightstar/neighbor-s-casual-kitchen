services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neighbors
      POSTGRES_PASSWORD: neighbors
      POSTGRES_DB: neighbors
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighbors -d neighbors"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://neighbors:neighbors@db:5432/neighbors
      DATABASE_URL_UNPOOLED: postgresql://neighbors:neighbors@db:5432/neighbors
      JWT_SECRET: local-docker-jwt-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      NEXT_PUBLIC_VAPI_PUBLIC_KEY: ${NEXT_PUBLIC_VAPI_PUBLIC_KEY:-}
      NEXT_PUBLIC_VAPI_ASSISTANT_ID: ${NEXT_PUBLIC_VAPI_ASSISTANT_ID:-}
      VAPI_PRIVATE_KEY: ${VAPI_PRIVATE_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
